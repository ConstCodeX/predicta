name: predictape

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-predictape}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predictape}"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s
    networks:
      - app-network

  # ── Backend NestJS + Prisma ──────────────────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:      production
      PORT:          3001
      DATABASE_URL:  postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-predictape}?schema=public
      JWT_SECRET:    ${JWT_SECRET:?JWT_SECRET es obligatoria}
      ADMIN_EMAIL:    ${ADMIN_EMAIL:?ADMIN_EMAIL es obligatoria}
      ADMIN_NAME:     ${ADMIN_NAME:-Super Admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD es obligatoria}
      GEMINI_API_KEY:    ${GEMINI_API_KEY:?GEMINI_API_KEY es obligatoria}
      GEMINI_USE_SEARCH: ${GEMINI_USE_SEARCH:-false}
      GEMINI_THINKING:   ${GEMINI_THINKING:-false}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - app-network

  # ── Frontend Vite → Nginx ────────────────────────────────────────────────────
  frontend:
    build:
      context:    .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network      # para comunicarse con backend por nombre
      - dokploy-network  # para que Traefik pueda enrutar el dominio a este contenedor

networks:
  # Red interna entre los tres servicios
  app-network:
    driver: bridge
  # Red de Traefik — gestionada por Dokploy, debe existir en el servidor
  dokploy-network:
    external: true

volumes:
  postgres_data:
    driver: local
