name: predictape

services:

  # ── PostgreSQL 16 ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-predictape}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:         ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-predictape}"]
      interval:     10s
      timeout:      5s
      retries:      5
      start_period: 20s
    networks:
      - app-network

  # ── Backend NestJS + Prisma ──────────────────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV:     production
      PORT:         3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-predictape}?schema=public
      GROQ_API_KEY: ${GROQ_API_KEY:?GROQ_API_KEY es obligatoria}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL:    ${LLM_MODEL:-gemma2-9b-it}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3001"
    networks:
      - app-network

  # ── Frontend Vite → Nginx ────────────────────────────────────────────────────
  frontend:
    build:
      context:    .
      dockerfile: apps/frontend/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  # Red explícita y compartida para todos los servicios.
  # Sin esto, Dokploy puede aislar los contenedores en redes separadas
  # impidiendo que se resuelvan entre sí por nombre de servicio.
  app-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
