server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── DNS resolver de Docker (127.0.0.11) ─────────────────────────────────
    # Usando una variable para proxy_pass, nginx resuelve el upstream en cada
    # petición en lugar de al arrancar. Esto evita el error:
    #   "host not found in upstream backend"
    # que ocurre cuando nginx inicia antes de que el contenedor backend esté listo.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Assets estáticos con hash (Vite los genera inmutables) ──────────────
    location ~* \.(js|css|woff|woff2|ttf|eot|svg|ico|png|jpg|jpeg|webp|avif|map)$ {
        expires            1y;
        add_header         Cache-Control "public, immutable";
        try_files          $uri =404;
    }

    # ── Proxy /api/ → backend NestJS ─────────────────────────────────────────
    location /api/ {
        set $upstream_backend http://backend:3001;
        proxy_pass         $upstream_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        client_max_body_size 50M;
        proxy_read_timeout   180s;
        proxy_send_timeout   60s;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
